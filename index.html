<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boil & Blaze — Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --dark: #111111;
    --card: #161616;
    --border: #222222;
    --gold: #E8A020;
    --gold-dim: #B87A18;
    --gold-light: #F5C060;
    --red: #C0200A;
    --white: #F5F0E8;
    --gray: #888880;
    --dashed: repeating-linear-gradient(90deg, #333 0, #333 6px, transparent 6px, transparent 12px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── LOADING ── */
  #loading {
    position: fixed; inset: 0;
    background: var(--black);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 999;
    gap: 20px;
  }
  #loading .flame { font-size: 48px; animation: flicker 0.8s infinite alternate; }
  @keyframes flicker { from { opacity: 1; transform: scale(1); } to { opacity: 0.6; transform: scale(1.1); } }
  #loading p { color: var(--gold); font-family: 'Barlow Condensed', sans-serif; font-size: 18px; letter-spacing: 3px; text-transform: uppercase; }

  /* ── HEADER ── */
  header {
    background: var(--dark);
    border-bottom: 2px solid var(--gold);
    padding: 28px 24px 20px;
    text-align: center;
    position: relative;
  }
  .logo-area { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
  .logo-text-block { text-align: left; }
  .logo-main {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    line-height: 1;
    color: var(--gold);
    letter-spacing: 2px;
    text-shadow: 0 0 30px rgba(232,160,32,0.3);
  }
  .logo-main span { color: var(--red); }
  .logo-sub {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    letter-spacing: 5px;
    color: var(--gray);
    text-transform: uppercase;
    margin-top: 2px;
  }
  .diamond { color: var(--gold); margin: 0 6px; font-size: 10px; }

  /* ── NAV TABS ── */
  nav {
    background: var(--dark);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  .nav-inner {
    display: flex;
    min-width: max-content;
    padding: 0 16px;
  }
  .tab-btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gray);
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    padding: 14px 18px 11px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tab-btn:hover { color: var(--white); }
  .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

  /* ── CONTENT ── */
  main { max-width: 860px; margin: 0 auto; padding: 32px 20px 60px; }

  .section { display: none; }
  .section.active { display: block; }

  /* ── SECTION HEADER ── */
  .section-header { margin-bottom: 28px; }
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    color: var(--white);
    line-height: 1;
    letter-spacing: 1px;
  }
  .section-sub {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    letter-spacing: 4px;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-top: 4px;
  }
  .gold-rule { height: 2px; background: var(--gold); margin: 16px 0 24px; opacity: 0.6; }

  /* ── MENU ITEM ── */
  .menu-item {
    padding: 20px 0;
    border-bottom: 1px solid;
    border-image: var(--dashed) 1;
  }
  .menu-item:last-child { border-bottom: none; }

  .item-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .item-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.5px;
    flex: 1;
  }
  .item-price {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--white);
    white-space: nowrap;
  }
  .item-price .omr { font-size: 14px; color: var(--gray); margin-left: 2px; }
  .item-desc {
    font-size: 13px;
    color: var(--gray);
    margin-top: 5px;
    line-height: 1.6;
  }
  .item-note {
    font-size: 12px;
    color: var(--gold-dim);
    font-style: italic;
    margin-top: 4px;
  }
  .item-allergen {
    font-size: 12px;
    color: #c0602a;
    font-style: italic;
    margin-top: 4px;
  }

  /* ── SIZE TABLE (platters) ── */
  .size-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
  }
  .size-table th {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gray);
    text-align: center;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
  }
  .size-table td {
    text-align: center;
    padding: 8px;
  }
  .size-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--gray);
    text-transform: uppercase;
    display: block;
  }
  .size-price {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    color: var(--gold);
  }

  /* ── COOKING STYLE BADGE ── */
  .cook-badge {
    display: inline-flex;
    gap: 8px;
    background: #1a1a1a;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 14px;
    margin: 16px 0 8px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gray);
  }
  .cook-badge .boil { color: var(--white); font-weight: 700; }
  .cook-badge .blaze { color: var(--red); font-weight: 700; }

  /* ── SUBSECTION ── */
  .subsection-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin: 28px 0 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  /* ── EXTRAS GRID ── */
  .extras-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
  }
  .extra-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    gap: 8px;
  }
  .extra-name { font-size: 13px; color: var(--white); flex: 1; }
  .extra-price {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    color: var(--gold);
    white-space: nowrap;
  }

  /* ── SAUCE PILLS ── */
  .sauce-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .sauce-item { display: flex; flex-direction: column; gap: 2px; }
  .sauce-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.5px;
  }
  .sauce-ingredients { font-size: 12px; color: var(--gray); }
  .sauce-note { font-size: 11px; color: #c0602a; font-style: italic; }

  /* ── DRINKS ── */
  .drink-item { padding: 16px 0; border-bottom: 1px solid; border-image: var(--dashed) 1; }
  .drink-row { display: flex; justify-content: space-between; align-items: center; }
  .drink-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .drink-price {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    color: var(--white);
  }
  .drink-ingredients { font-size: 12px; color: var(--gray); margin-top: 3px; }

  /* ── KIDS BOX ── */
  .kids-box {
    border: 1px solid var(--gold-dim);
    border-radius: 4px;
    padding: 28px;
    text-align: center;
    margin: 8px 0;
  }
  .kids-choice-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    color: var(--gold);
    letter-spacing: 3px;
    margin-bottom: 6px;
  }
  .kids-sub { font-size: 13px; color: var(--gray); margin-bottom: 20px; }
  .kids-options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    border: 1px solid var(--border);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .kids-option {
    padding: 14px 8px;
    background: #1a1a1a;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--white);
    border-right: 1px solid var(--border);
  }
  .kids-option:last-child { border-right: none; }
  .kids-diamond { color: var(--gold); display: block; margin-top: 6px; font-size: 12px; }
  .kids-price-badge {
    background: var(--gold);
    color: var(--black);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 2px;
    display: inline-block;
    padding: 6px 24px;
    border-radius: 3px;
    margin-bottom: 16px;
  }
  .kids-includes { font-size: 13px; color: var(--gray); margin-bottom: 16px; }
  .kids-includes span { color: var(--white); }
  .kids-note-box {
    background: #161616;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 10px 16px;
    font-size: 12px;
    color: var(--gold-dim);
  }

  /* ── INFO BANNER ── */
  .info-banner {
    background: #161616;
    border: 1px solid var(--border);
    border-left: 3px solid var(--gold);
    border-radius: 3px;
    padding: 12px 16px;
    margin: 20px 0;
    font-size: 13px;
    color: var(--gray);
    text-align: center;
  }
  .info-banner strong { color: var(--gold); display: block; margin-bottom: 3px; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 1px; font-size: 14px; }

  /* ── FOOTER ── */
  footer {
    border-top: 1px solid var(--border);
    padding: 24px;
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--gray);
    text-transform: uppercase;
  }
  footer a { color: var(--gold); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  /* ── LAST UPDATED ── */
  .last-updated {
    text-align: center;
    font-size: 11px;
    color: #444;
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 1px;
    padding: 8px;
  }

  @media (max-width: 600px) {
    .logo-main { font-size: 38px; }
    .section-title { font-size: 36px; }
    .extras-grid { grid-template-columns: 1fr; }
    .kids-options { grid-template-columns: 1fr; }
    .kids-option { border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="flame">🔥</div>
  <p>Loading Menu...</p>
</div>

<header>
  <div class="logo-area">
    <div class="logo-text-block">
      <div class="logo-main">BOIL <span>&</span> BLAZE</div>
      <div class="logo-sub">Seafood Boil <span class="diamond">◆</span> Bold Flavor</div>
    </div>
  </div>
</header>

<nav>
  <div class="nav-inner" id="navTabs"></div>
</nav>

<main id="mainContent"></main>

<div class="last-updated" id="lastUpdated"></div>

<footer>
  <a href="https://boilandblaze.com">boilandblaze.com</a>
  <span class="diamond"> ◆ </span>
  Shati Al Qurum, Muscat, Sultanate of Oman
</footer>

<script>
// ═══════════════════════════════════════════════════════
// CONFIGURATION — Replace SHEET_ID with your Google Sheet ID
// The sheet must be published: File > Share > Publish to web > CSV
// ═══════════════════════════════════════════════════════
// Published base URL — from File > Share > Publish to web
const PUBLISHED_BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT9etQnksu5m1L2ra57stKkkCQ3KMZninCo3X0ikDxLOwhAHeQ5PZfPYcjmROaFOjxMsFiZhciH65-m/pub';

const TABS = [
  { key: 'B&B',            label: 'Seafood Boil',    icon: '🦞' },
  { key: 'Appetizer',      label: 'Appetizers',      icon: '🦐' },
  { key: 'Rolls & Bowls',  label: 'Rolls & Bowls',   icon: '🍜' },
  { key: 'Sides & Salads', label: 'Sides & Salads',  icon: '🍟' },
  { key: 'Drinks',         label: 'Drinks',          icon: '🥤' },
  { key: 'Kids Menu',      label: 'Kids Menu',       icon: '⭐' },
];

// ═══════════════════════════════════════════════════════
// DATA CACHE
// ═══════════════════════════════════════════════════════
const cache = {};
let activeTab = 'B&B';

async function fetchSheet(tabName) {
  if (cache[tabName]) return cache[tabName];
  const url = `${PUBLISHED_BASE}?gid=auto&single=true&output=csv&sheet=${encodeURIComponent(tabName)}`;
  const res = await fetch(url);
  const text = await res.text();
  cache[tabName] = parseCSV(text);
  return cache[tabName];
}

function parseCSV(text) {
  const rows = [];
  const lines = text.split('\n');
  for (const line of lines) {
    if (!line.trim()) continue;
    const cols = line.match(/(".*?"|[^,]+|(?<=,)(?=,)|^(?=,)|(?<=,)$)/g) || [];
    rows.push(cols.map(c => c.replace(/^"|"$/g, '').trim()));
  }
  return rows;
}

// ═══════════════════════════════════════════════════════
// RENDERERS — one per section
// ═══════════════════════════════════════════════════════

function renderBB(rows) {
  // Parse platters, extras, sauces from raw rows
  const platters = [], extras = [], sauces = [];
  let mode = 'platters';
  let currentPlatter = null;
  let currentSauce = null;

  for (const row of rows) {
    const [a, b, c, d] = row;
    if (!a) continue;
    if (a === 'Extras:') { mode = 'extras'; continue; }
    if (a === 'Options:' || a === 'Boil ' || a === 'Blaze') continue;

    if (mode === 'platters') {
      if (b && b.includes('OMR') && c && c.includes('OMR')) {
        currentPlatter = { name: a, small: b, medium: c, large: d || '', ingredients: [] };
        platters.push(currentPlatter);
      } else if (currentPlatter && !b) {
        currentPlatter.ingredients.push(a);
      } else if (a.includes('Sauce') && !b) {
        mode = 'sauces';
        currentSauce = { name: a, ingredients: [], note: '' };
        sauces.push(currentSauce);
      }
    } else if (mode === 'extras') {
      if (a.includes('Sauce') && !b) { mode = 'sauces'; currentSauce = { name: a, ingredients: [], note: '' }; sauces.push(currentSauce); continue; }
      if (b && b.includes('OMR')) extras.push({ name: a, price: b });
      else if (!b) extras.push({ name: a, price: '' });
    } else if (mode === 'sauces') {
      if (!b && a !== 'Extras:') {
        if (a.includes('Sauce') && !currentSauce?.ingredients?.length) {
          currentSauce = { name: a, ingredients: [], note: '' };
          sauces.push(currentSauce);
        } else if (a.startsWith('Note:')) {
          if (currentSauce) currentSauce.note = a.replace('Note: ', '');
        } else {
          if (currentSauce) currentSauce.ingredients.push(a);
        }
      }
    }
  }

  let html = `
    <div class="section-header">
      <div class="section-title">Seafood Boil</div>
      <div class="section-sub">Signature Platters <span class="diamond">◆</span> Boil or Blaze</div>
    </div>
    <div class="gold-rule"></div>`;

  // Size header
  html += `<table class="size-table"><thead><tr>
    <th style="text-align:left">Platter</th>
    <th><span class="size-label">Small</span><span style="font-size:11px;color:#666">(1 Person)</span></th>
    <th><span class="size-label">Medium</span><span style="font-size:11px;color:#666">(2 Persons)</span></th>
    <th><span class="size-label">Large</span><span style="font-size:11px;color:#666">(4 Persons)</span></th>
  </tr></thead><tbody>`;

  for (const p of platters) {
    html += `<tr>
      <td style="text-align:left;padding:16px 8px 8px 0">
        <div class="item-name">${p.name}</div>
        <div class="item-desc">${p.ingredients.join(', ')}</div>
      </td>
      <td><span class="size-price">${p.small.replace(' OMR','')}</span><span class="omr"> OMR</span></td>
      <td><span class="size-price">${p.medium.replace(' OMR','')}</span><span class="omr"> OMR</span></td>
      <td><span class="size-price">${p.large.replace(' OMR','')}</span><span class="omr"> OMR</span></td>
    </tr>`;
  }
  html += `</tbody></table>`;

  html += `<div class="cook-badge">Cooking Style: <span class="boil">BOIL</span> or <span class="blaze">BLAZE</span></div>`;

  // Extras
  html += `<div class="subsection-title">Extras</div><div class="extras-grid">`;
  for (const e of extras) {
    html += `<div class="extra-row">
      <span class="extra-name">${e.name}</span>
      ${e.price ? `<span class="extra-price">${e.price.replace(' OMR','')} <span style="font-size:11px;color:#666;font-family:Barlow,sans-serif;font-weight:400">OMR</span></span>` : ''}
    </div>`;
  }
  html += `</div>`;

  // Sauces
  html += `<div class="subsection-title">Sauces</div><div class="sauce-list">`;
  for (const s of sauces) {
    html += `<div class="sauce-item">
      <span class="sauce-name">${s.name}</span>
      ${s.ingredients.length ? `<span class="sauce-ingredients">${s.ingredients.join(', ')}</span>` : ''}
      ${s.note ? `<span class="sauce-note">${s.note}</span>` : ''}
    </div>`;
  }
  html += `</div>`;

  return html;
}

function renderAppetizer(rows) {
  const items = [], dips = [];
  let mode = 'items';
  let current = null;

  for (const row of rows) {
    const [a, b] = row;
    if (!a) continue;
    if (['Avocado Sauce','Tartar Sauce','Honey Mustard'].includes(a) && !b) { mode = 'dips'; }
    if (mode === 'items') {
      if (b && b.includes('OMR')) { current = { name: a, price: b, ingredients: [] }; items.push(current); }
      else if (current && !b) current.ingredients.push(a);
    } else {
      if (!b) dips.push({ name: a });
      else if (b && !b.includes('OMR')) dips[dips.length-1] && dips[dips.length-1].ingredients ? dips[dips.length-1].ingredients.push(a) : null;
    }
  }

  let html = `<div class="section-header">
    <div class="section-title">Appetizers</div>
    <div class="section-sub">Starters & Bites</div>
  </div><div class="gold-rule"></div>`;

  for (const item of items) {
    html += `<div class="menu-item">
      <div class="item-row">
        <div class="item-name">${item.name}</div>
        <div class="item-price">${item.price.replace(' OMR','')} <span class="omr">OMR</span></div>
      </div>
      <div class="item-desc">${item.ingredients.join(', ')}</div>
    </div>`;
  }

  html += `<div class="subsection-title">Dipping Sauces</div>
  <div class="sauce-list">
    <div class="sauce-item"><span class="sauce-name">Avocado Sauce</span><span class="sauce-ingredients">Avocado, Mayo, Sour Cream</span></div>
    <div class="sauce-item"><span class="sauce-name">Tartar Sauce</span><span class="sauce-ingredients">Mayo, Pickle</span></div>
    <div class="sauce-item"><span class="sauce-name">Honey Mustard</span><span class="sauce-ingredients">Mayo, Dejun Mustard</span></div>
  </div>
  <div class="info-banner"><strong>All appetizers served with your choice of dipping sauce</strong>Ask your server about allergen information</div>`;

  return html;
}

function renderRolls(rows) {
  const items = [];
  let current = null;

  for (const row of rows) {
    const [a, b] = row;
    if (!a) continue;
    if (b && b.includes('OMR')) {
      current = { name: a.replace(':',''), price: b, ingredients: [], note: '' };
      items.push(current);
    } else if (current) {
      if (a.startsWith('Note:')) current.note = a.replace('Note: ','');
      else if (!b) current.ingredients.push(a);
    }
  }

  let html = `<div class="section-header">
    <div class="section-title">Rolls & Bowls</div>
    <div class="section-sub">Pasta · Noodles · Fried Rice · Rolls</div>
  </div><div class="gold-rule"></div>`;

  for (const item of items) {
    html += `<div class="menu-item">
      <div class="item-row">
        <div class="item-name">${item.name}</div>
        <div class="item-price">${item.price.replace(' OMR','')} <span class="omr">OMR</span></div>
      </div>
      <div class="item-desc">${item.ingredients.join(', ')}</div>
      ${item.note ? `<div class="item-allergen">${item.note}</div>` : ''}
    </div>`;
  }

  html += `<div class="info-banner"><strong>Allergen Note</strong>Items marked contain gluten and/or dairy. Please inform your server of any dietary requirements before ordering.</div>`;
  return html;
}

function renderSides(rows) {
  const items = [];
  let current = null;

  for (const row of rows) {
    const [a, b, c] = row;
    if (!a) continue;
    if (b && (b.includes('OMR') || b === '')) {
      current = { name: a.replace(':',''), price: b, priceAlt: c || '', ingredients: [] };
      items.push(current);
    } else if (current && !b) {
      current.ingredients.push(a);
    }
  }

  let html = `<div class="section-header">
    <div class="section-title">Sides & Salads</div>
    <div class="section-sub">Soup · Salad · Fries</div>
  </div><div class="gold-rule"></div>`;

  for (const item of items) {
    const priceDisplay = item.priceAlt
      ? `<div style="text-align:right"><span class="item-price">${item.price.replace(' OMR','').replace(' Large','')} <span class="omr">OMR</span></span><br><span style="font-size:12px;color:var(--gray)">Large</span><br><span class="item-price" style="font-size:17px">${item.priceAlt.replace(' OMR','').replace(' Small','')} <span class="omr">OMR</span></span><br><span style="font-size:12px;color:var(--gray)">Small</span></div>`
      : `<div class="item-price">${item.price.replace(' OMR','')} <span class="omr">OMR</span></div>`;
    html += `<div class="menu-item">
      <div class="item-row">
        <div class="item-name">${item.name}</div>
        ${priceDisplay}
      </div>
      ${item.ingredients.length ? `<div class="item-desc">${item.ingredients.join(', ')}</div>` : ''}
    </div>`;
  }

  html += `<div class="info-banner"><strong>All sides are freshly prepared</strong>Fries available in regular and large portions. Ask your server for upgrades and add-ons.</div>`;
  return html;
}

function renderDrinks(rows) {
  const mocktails = [], soft = [];
  let mode = 'mocktails';
  let current = null;

  for (const row of rows) {
    const [a, b] = row;
    if (!a) continue;
    if (['Sweet Ice-Tea (Unlimited)','Soft Drink','Water','Luban (Frankincense) Water'].includes(a)) { mode = 'soft'; }
    if (mode === 'mocktails') {
      if (b && b.includes('OMR')) { current = { name: a.replace(':',''), price: b, ingredients: [] }; mocktails.push(current); }
      else if (current && !b) current.ingredients.push(a);
    } else {
      if (b && b.includes('OMR')) soft.push({ name: a, price: b });
    }
  }

  let html = `<div class="section-header">
    <div class="section-title">Drinks</div>
    <div class="section-sub">Signature Mocktails & Beverages</div>
  </div><div class="gold-rule"></div>`;

  for (const d of mocktails) {
    html += `<div class="drink-item">
      <div class="drink-row">
        <div class="drink-name">${d.name}</div>
        <div class="drink-price">${d.price.replace(' OMR','')} <span style="font-size:13px;color:var(--gray);font-family:Barlow,sans-serif">OMR</span></div>
      </div>
      <div class="drink-ingredients">${d.ingredients.join(', ')}</div>
    </div>`;
  }

  html += `<div class="subsection-title">Soft Beverages</div>`;
  for (const d of soft) {
    html += `<div class="drink-item">
      <div class="drink-row">
        <div class="drink-name" style="font-size:16px;text-transform:none;letter-spacing:0">${d.name}</div>
        <div class="drink-price">${d.price.replace(' OMR','')} <span style="font-size:13px;color:var(--gray);font-family:Barlow,sans-serif">OMR</span></div>
      </div>
    </div>`;
  }

  return html;
}

function renderKids(rows) {
  const options = [];
  let price = '3 OMR';

  for (const row of rows) {
    const [a, b] = row;
    if (!a) continue;
    if (a === 'Your choice:' && b) { price = b; continue; }
    if (['Chicken Nuggets','Chicken Tenders','Chicken Popcorn'].includes(a)) options.push(a);
  }

  return `<div class="section-header">
    <div class="section-title">Kids Menu</div>
    <div class="section-sub">Little Explorers</div>
  </div><div class="gold-rule"></div>
  <div class="kids-box">
    <div class="kids-choice-title">YOUR CHOICE</div>
    <div class="kids-sub">Pick one main · served with French Fries & Fresh Juice</div>
    <div class="kids-options">
      ${options.map(o => `<div class="kids-option">${o}<span class="kids-diamond">◆</span></div>`).join('')}
    </div>
    <div class="kids-price-badge">${price}</div>
    <div class="kids-includes">Every meal includes: <span>French Fries</span> + <span>Fresh Juice</span></div>
    <div class="kids-note-box"><strong style="color:var(--gold)">Perfect for our little seafood adventurers</strong><br>Ages 12 and under · Please inform your server of any allergies</div>
  </div>`;
}

const RENDERERS = {
  'B&B': renderBB,
  'Appetizer': renderAppetizer,
  'Rolls & Bowls': renderRolls,
  'Sides & Salads': renderSides,
  'Drinks': renderDrinks,
  'Kids Menu': renderKids,
};

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
async function loadSection(tabKey) {
  activeTab = tabKey;

  // Update tab UI
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.key === tabKey));

  const main = document.getElementById('mainContent');
  main.innerHTML = `<div style="text-align:center;padding:60px 0;color:var(--gray);font-family:'Barlow Condensed',sans-serif;letter-spacing:3px;font-size:14px;text-transform:uppercase">Loading...</div>`;

  try {
    const rows = await fetchSheet(tabKey);
    const renderer = RENDERERS[tabKey];
    if (renderer) {
      main.innerHTML = `<div class="section active">${renderer(rows)}</div>`;
    }
    document.getElementById('lastUpdated').textContent = 'Last updated: ' + new Date().toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
  } catch (e) {
    main.innerHTML = `<div style="text-align:center;padding:60px 20px;color:#666">
      <div style="font-size:32px;margin-bottom:16px">🔗</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:18px;letter-spacing:2px;color:var(--gold);margin-bottom:8px">CONNECT YOUR GOOGLE SHEET</div>
      <div style="font-size:13px;line-height:1.8">Replace <code style="background:#1a1a1a;padding:2px 6px;border-radius:3px;color:var(--gold-light)">YOUR_GOOGLE_SHEET_ID_HERE</code> in the script<br>with your actual Google Sheet ID to load live data.</div>
    </div>`;
  }

  document.getElementById('loading').style.display = 'none';
}

function buildNav() {
  const nav = document.getElementById('navTabs');
  for (const tab of TABS) {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (tab.key === activeTab ? ' active' : '');
    btn.dataset.key = tab.key;
    btn.innerHTML = `${tab.icon} ${tab.label}`;
    btn.onclick = () => loadSection(tab.key);
    nav.appendChild(btn);
  }
}

buildNav();
loadSection('B&B');
</script>
</body>
</html>
